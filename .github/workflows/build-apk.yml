name: Build PlantTrack V2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 🩹 FIX (2026-09-16): android-actions/setup-android se rompió porque
      # Google ELIMINÓ el paquete legacy 'tools' de su repositorio
      # ("Failed to find package 'tools'" → exit code 1). Afecta a v3 y v4.
      # El runner ubuntu-latest YA trae el Android SDK completo preinstalado
      # (ANDROID_HOME, platform-tools, build-tools, android-34/35, licencias),
      # así que usamos el SDK del runner directamente + instalación defensiva
      # de los componentes exactos que necesita Capacitor 6 (compileSdk 34).
      - name: Setup Android SDK (preinstalado en el runner)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)"
          fi
          echo "sdkmanager en: $SDKMANAGER"
          # Licencias (defensivo: no rompe el build si falla la red)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Componentes de Capacitor 6 — idempotente: si ya están, es no-op
          yes | "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 \
            || echo "⚠️ sdkmanager install falló — confiando en componentes preinstalados"
          echo "✅ Plataformas disponibles:" && ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "✅ Build-tools disponibles:" && ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "ℹ️ android/ ya existe — saltando cap add"
          fi

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      # 🌿 PlantTrack: ícono de hoja esmeralda en todas las
      # densidades + splash verde. Se copia ENCIMA del res/
      # generado por `cap add android` (patrón F3.34 RiderTrack).
      - name: Apply PlantTrack launcher icon + splash
        run: |
          if [ -d android-icons ]; then
            # 1) Borrar los splash por densidad del template Capacitor:
            #    si quedan, Android los prefiere y saldría el splash default.
            rm -rf android/app/src/main/res/drawable-port-hdpi \
                   android/app/src/main/res/drawable-port-mdpi \
                   android/app/src/main/res/drawable-port-xhdpi \
                   android/app/src/main/res/drawable-port-xxhdpi \
                   android/app/src/main/res/drawable-port-xxxhdpi \
                   android/app/src/main/res/drawable-land-hdpi \
                   android/app/src/main/res/drawable-land-mdpi \
                   android/app/src/main/res/drawable-land-xhdpi \
                   android/app/src/main/res/drawable-land-xxhdpi \
                   android/app/src/main/res/drawable-land-xxxhdpi
            # 2) Borrar los vectores del robot Capacitor huérfanos
            rm -f android/app/src/main/res/drawable/ic_launcher_background.xml \
                  android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
            rmdir android/app/src/main/res/drawable-v24 2>/dev/null || true
            # 3) Nuestros recursos encima del res/ generado
            cp -r android-icons/. android/app/src/main/res/
            echo "✅ Ícono PlantTrack aplicado (launcher + round + adaptivo + splash)"
            ls android/app/src/main/res/ | sort
          else
            echo "⚠️ android-icons/ NO existe — el APK saldrá con el ícono default de Capacitor"
          fi

      # 📱 WIDGET 2x2: plantas + próximo riego en el escritorio.
      # El código nativo vive en android-widget/ (mismo patrón que
      # android-icons/): se copia ENCIMA del proyecto generado por
      # cap add android, y el receiver se inyecta en el manifest
      # con un one-liner de python (nada de heredocs multi-línea).
      - name: Install home screen widget (PlantTrack)
        run: |
            if [ -d android-widget ]; then
              # Java nativo (mismo paquete que la app: com.planttrack.v2)
              cp android-widget/WidgetPlantTrack.java android-widget/WidgetBridge.java android/app/src/main/java/com/planttrack/v2/
              # MainActivity custom: registra el plugin ANTES de que el
              # bridge se construya (Capacitor 6 lo arma en onCreate)
              cp android-widget/MainActivity.java android/app/src/main/java/com/planttrack/v2/MainActivity.java
              # Recursos: layout + fondo redondeado + config del widget
              mkdir -p android/app/src/main/res/xml
              cp android-widget/res/layout/widget_planttrack.xml android/app/src/main/res/layout/
              cp android-widget/res/drawable/widget_bg.xml android/app/src/main/res/drawable/
              cp android-widget/res/xml/widget_info_planttrack.xml android/app/src/main/res/xml/
              # Registrar el receiver en el AndroidManifest (one-liner)
              python3 -c "m=open('android/app/src/main/AndroidManifest.xml').read(); r=open('android-widget/receiver.xml').read(); open('android/app/src/main/AndroidManifest.xml','w').write(m.replace('</application>', r + '\n    </application>'))"
              # Keep rule defensivo (por si R8 se activa algún día)
              echo "-keep class com.planttrack.v2.** { *; }" >> android/app/proguard-rules.pro
              echo "✅ Widget instalado (receiver + layout + plugin bridge)"
            else
              echo "⚠️ android-widget/ no existe — APK sin widget"
            fi

      - name: Configure app strings
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">PlantTrack V2</string><string name="title_activity_main">PlantTrack V2</string><string name="package_name">com.planttrack.v2</string><string name="custom_url_scheme">com.planttrack.v2</string><string name="widget_desc">Tus plantas y el próximo riego en el escritorio</string></resources>' > android/app/src/main/res/values/strings.xml
          # Versión visible del APK (versionCode 12 / versionName 1.4.2)
          sed -i 's/versionCode 1$/versionCode 12/; s/versionName "1.0"/versionName "1.4.2"/' android/app/build.gradle

      # ☁️ FIREBASE (Google Auth + Firestore) — todo condicional:
      # si no hay google-services.json (ni secret ni repo), la app sale
      # en modo 100% local y este paso es un no-op. Cuando el proyecto
      # Firebase exista: secret GOOGLE_SERVICES_JSON (base64 del json)
      # o el archivo commiteado en la raíz (patrón RiderTrack v2).
      - name: Setup Firebase (Google Auth + Firestore)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > google-services.json
            echo "✅ google-services.json desde secret GOOGLE_SERVICES_JSON"
          elif [ -f google-services.json ]; then
            echo "ℹ️ google-services.json del repo"
          else
            echo "ℹ️ Sin Firebase — la app funciona en modo local (sin cuenta en la nube)"
            exit 0
          fi
          cp google-services.json android/app/google-services.json
          # Plugin gradle google-services (proyecto + módulo app)
          PROJECT_GRADLE="android/build.gradle"
          if ! grep -q "com.google.gms.google-services" "$PROJECT_GRADLE"; then
            sed -i '/buildscript {/a\    repositories { google() mavenCentral() }\n    dependencies { classpath "com.google.gms:google-services:4.4.2" }' "$PROJECT_GRADLE" || true
          fi
          APP_GRADLE="android/app/build.gradle"
          if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            echo 'apply plugin: "com.google.gms.google-services"' >> "$APP_GRADLE"
          fi
          # Dependencia nativa de Google Sign-In (patrón RiderTrack)
          if ! grep -q "play-services-auth" "$APP_GRADLE"; then
            sed -i '/dependencies {/a\    implementation "com.google.android.gms:play-services-auth:20.7.0"' "$APP_GRADLE"
          fi
          # server_client_id en strings.xml — lo lee el plugin nativo
          # (oauth_client client_type 3 del json). One-liner para no
          # romper el block scalar de YAML con un python multi-línea.
          SERVER_CLIENT_ID=$(python3 -c "import json; d=json.load(open('google-services.json')); print(next((o['client_id'] for c in d.get('client',[]) for o in c.get('oauth_client',[]) if o.get('client_type')==3), ''))")
          # Fallback: web client (auto creado por Google Service) del
          # proyecto planttrack-6a0e1 — verificado en el flujo OAuth real
          # el 17-sep-2026. El json actual no lo incluye porque se descargó
          # antes de habilitar el proveedor Google en Authentication.
          if [ -z "$SERVER_CLIENT_ID" ]; then
            SERVER_CLIENT_ID="676327457162-7m0hfcsnh7vb5us0sh7pio6k5mntt301.apps.googleusercontent.com"
            echo "ℹ️ server_client_id no está en el json — usando el web client del proyecto"
          fi
          if [ -n "$SERVER_CLIENT_ID" ]; then
            sed -i "s|</resources>|<string name=\"server_client_id\">$SERVER_CLIENT_ID</string></resources>|" android/app/src/main/res/values/strings.xml
            echo "✅ server_client_id configurado: ${SERVER_CLIENT_ID:0:25}..."
          else
            echo "⚠️ oauth_client client_type 3 no encontrado — el login nativo podría fallar"
          fi

      - name: Update AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 📍 v1.4.1 FIX: ACCESS_COARSE/FINE_LOCATION eran necesarios para
          # el clima inteligente (@capacitor/geolocation NO los declara solo
          # en su propio manifest). Sin esta declaración Android OCULTA el
          # permiso en Ajustes y bloquea el diálogo sin preguntar.
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application|' "$MANIFEST"
          echo "✅ Permisos en el manifest:" && grep -c "uses-permission" "$MANIFEST"

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      # Build RELEASE: APK optimizado sin modo debugging
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Restore or generate keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "✅ Usando keystore guardado en Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "⚠️ No hay KEYSTORE_BASE64 — generando nuevo keystore"
            keytool -genkeypair \
              -keystore release.keystore \
              -alias planttrack \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass planttrack123 \
              -keypass planttrack123 \
              -dname "CN=PlantTrack, OU=Dev, O=Track, L=Lima, S=Lima, C=PE"
            echo "SHA-1 del keystore nuevo:"
            keytool -list -v -keystore release.keystore -alias planttrack -storepass planttrack123 | grep "SHA1:"
          fi

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name "zipalign" | head -1)
          $ZIPALIGN -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk PlantTrackV2-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" | head -1)
          $APKSIGNER sign --ks release.keystore --ks-key-alias planttrack --ks-pass pass:planttrack123 --key-pass pass:planttrack123 --out PlantTrackV2.apk PlantTrackV2-aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PlantTrackV2-APK
          path: PlantTrackV2.apk
          retention-days: 30

      # 🌐 GitHub Pages: publica el build web en docs/ para probar
      # la app desde el navegador del celular sin instalar nada.
      - name: Publish web build to GitHub Pages (docs/)
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll

      - name: Commit docs (web version)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🌐 deploy: web build a docs/ (GitHub Pages)"
          file_pattern: docs/
