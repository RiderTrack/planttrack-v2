name: Generate Keystore & Secrets

# 🔑 Utilidad de firma de PlantTrack V2 (patrón RiderTrack v2).
# Se ejecuta MANUALMENTE desde la pestaña Actions → "Generate Keystore
# & Secrets" → "Run workflow".
#
# Dos modos:
#   • RECUPERACIÓN (ya existe KEYSTORE_BASE64 en Secrets): decodifica el
#     keystore ACTUAL y muestra sus huellas SHA1/SHA256 + vigencia.
#     ⚠️ NO lo reemplaza — un keystore nuevo cambiaría la firma y la app
#     dejaría de instalarse encima de las versiones anteriores.
#   • GENERACIÓN (no hay secret): crea un keystore nuevo (RSA 2048,
#     validez 30 años, alias planttrack) y muestra su base64 para copiar
#     a GitHub Secrets.
#
# Las huellas SHA1/SHA256 se necesitan para registrar la app en Firebase
# (Google Sign-In) y en Google Cloud Console.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore keystore from Secrets (or generate new)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔑 MODO RECUPERACIÓN — ya existe KEYSTORE_BASE64 en Secrets"
            echo "   Se muestran las huellas del keystore ACTUAL (no se genera uno nuevo:"
            echo "   cambiar la firma impediría actualizar la app instalada)."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > planttrack.keystore
            echo "MODO=recuperado" >> $GITHUB_ENV
          else
            echo "🆕 MODO GENERACIÓN — no hay KEYSTORE_BASE64 en Secrets"
            keytool -genkey -v \
              -keystore planttrack.keystore \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -alias planttrack \
              -storepass "planttrack123" \
              -keypass "planttrack123" \
              -dname "CN=PlantTrack,OU=Dev,O=RiderTrack,L=Lima,ST=Lima,C=PE"
            echo "MODO=nuevo" >> $GITHUB_ENV
          fi

      - name: Get SHA1 & SHA256 fingerprints
        run: |
          INFO=$(keytool -list -v \
            -keystore planttrack.keystore \
            -alias planttrack \
            -storepass "planttrack123")

          SHA1=$(echo "$INFO" | grep "SHA1:" | head -1 | awk '{print $NF}')
          SHA256=$(echo "$INFO" | grep "SHA256:" | head -1 | awk '{print $NF}')
          VALIDO_DESDE=$(echo "$INFO" | grep "Valid from" | head -1)
          VALIDO_HASTA=$(echo "$INFO" | grep "until" | head -1)

          # Formato limpio (sin dos puntos, minúscula) para Google Cloud/Firebase
          echo "SHA1_CLEAN=$(echo $SHA1 | tr -d ':' | tr 'A-F' 'a-f')" >> $GITHUB_ENV
          echo "SHA256_CLEAN=$(echo $SHA256 | tr -d ':' | tr 'A-F' 'a-f')" >> $GITHUB_ENV
          echo "SHA1_FMT=$SHA1" >> $GITHUB_ENV
          echo "SHA256_FMT=$SHA256" >> $GITHUB_ENV
          echo "VALIDEZ='$VALIDO_DESDE $VALIDO_HASTA'" >> $GITHUB_ENV

      - name: Encode keystore to Base64 (solo si es nuevo)
        if: env.MODO == 'nuevo'
        run: |
          KEYSTORE_B64=$(base64 -w 0 planttrack.keystore)
          echo "KEYSTORE_B64=$KEYSTORE_B64" >> $GITHUB_ENV

      - name: Display Secrets
        run: |
          echo ""
          echo "═════════════════════════════════════════════════════════"
          if [ "$MODO" = "nuevo" ]; then
            echo "  🆕 KEYSTORE NUEVO — COPIA ESTO A GITHUB SECRETS:"
            echo "═════════════════════════════════════════════════════════"
            echo "  Nombre: KEYSTORE_BASE64"
            echo "  Valor:"
            echo "  $KEYSTORE_B64"
            echo ""
            echo "  ⚠️ DESPUÉS DE COPIARLO: borrá este run del historial"
            echo "  (Actions → run → ⋯ → Delete workflow run) porque el"
            echo "  repo es público y el base64 quedó en el log."
          else
            echo "  🔑 KEYSTORE ACTUAL (recuperado de Secrets)"
            echo "═════════════════════════════════════════════════════════"
            echo "  El keystore YA está guardado — nada que copiar."
          fi
          echo "═════════════════════════════════════════════════════════"
          echo ""
          echo "📋 HUELLAS DE FIRMA (para Firebase / Google Cloud Console):"
          echo "─────────────────────────────────────────────────────────"
          echo "  SHA1 (formato estándar):"
          echo "  $SHA1_FMT"
          echo ""
          echo "  SHA1 (limpio, para Google Cloud):"
          echo "  $SHA1_CLEAN"
          echo ""
          echo "  SHA256 (formato estándar):"
          echo "  $SHA256_FMT"
          echo ""
          echo "  SHA256 (limpio):"
          echo "  $SHA256_CLEAN"
          echo ""
          echo "  Vigencia: $VALIDEZ"
          echo "─────────────────────────────────────────────────────────"
          echo ""
          echo "🧭 Firebase (Google Auth) — pasos futuros:"
          echo "  1. console.firebase.google.com → crear proyecto"
          echo "  2. Add app → Android → com.planttrack.v2"
          echo "  3. Pegar el SHA1 de arriba (Firebase → Configuración de"
          echo "     proyecto → Tus apps → Huella SHA1)"
          echo "  4. Descargar google-services.json → secret"
          echo "     GOOGLE_SERVICES_JSON (base64) para el build del APK"
