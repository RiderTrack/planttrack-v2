name: Build PlantTrack V2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      # 🌿 PlantTrack: ícono de hoja esmeralda en todas las
      # densidades + splash verde. Se copia ENCIMA del res/
      # generado por `cap add android` (patrón F3.34 RiderTrack).
      - name: Apply PlantTrack launcher icon + splash
        run: |
          if [ -d android-icons ]; then
            # 1) Borrar los splash por densidad del template Capacitor:
            #    si quedan, Android los prefiere y saldría el splash default.
            rm -rf android/app/src/main/res/drawable-port-hdpi \
                   android/app/src/main/res/drawable-port-mdpi \
                   android/app/src/main/res/drawable-port-xhdpi \
                   android/app/src/main/res/drawable-port-xxhdpi \
                   android/app/src/main/res/drawable-port-xxxhdpi \
                   android/app/src/main/res/drawable-land-hdpi \
                   android/app/src/main/res/drawable-land-mdpi \
                   android/app/src/main/res/drawable-land-xhdpi \
                   android/app/src/main/res/drawable-land-xxhdpi \
                   android/app/src/main/res/drawable-land-xxxhdpi
            # 2) Borrar los vectores del robot Capacitor huérfanos
            rm -f android/app/src/main/res/drawable/ic_launcher_background.xml \
                  android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
            rmdir android/app/src/main/res/drawable-v24 2>/dev/null || true
            # 3) Nuestros recursos encima del res/ generado
            cp -r android-icons/. android/app/src/main/res/
            echo "✅ Ícono PlantTrack aplicado (launcher + round + adaptivo + splash)"
            ls android/app/src/main/res/ | sort
          else
            echo "⚠️ android-icons/ NO existe — el APK saldrá con el ícono default de Capacitor"
          fi

      - name: Configure app strings
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">PlantTrack V2</string><string name="title_activity_main">PlantTrack V2</string><string name="package_name">com.planttrack.v2</string><string name="custom_url_scheme">com.planttrack.v2</string></resources>' > android/app/src/main/res/values/strings.xml

      - name: Update AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' "$MANIFEST"

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      # Build RELEASE: APK optimizado sin modo debugging
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Restore or generate keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "✅ Usando keystore guardado en Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "⚠️ No hay KEYSTORE_BASE64 — generando nuevo keystore"
            keytool -genkeypair \
              -keystore release.keystore \
              -alias planttrack \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass planttrack123 \
              -keypass planttrack123 \
              -dname "CN=PlantTrack, OU=Dev, O=Track, L=Lima, S=Lima, C=PE"
            echo "SHA-1 del keystore nuevo:"
            keytool -list -v -keystore release.keystore -alias planttrack -storepass planttrack123 | grep "SHA1:"
          fi

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name "zipalign" | head -1)
          $ZIPALIGN -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk PlantTrackV2-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" | head -1)
          $APKSIGNER sign --ks release.keystore --ks-key-alias planttrack --ks-pass pass:planttrack123 --key-pass pass:planttrack123 --out PlantTrackV2.apk PlantTrackV2-aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PlantTrackV2-APK
          path: PlantTrackV2.apk
          retention-days: 30

      # 🌐 GitHub Pages: publica el build web en docs/ para probar
      # la app desde el navegador del celular sin instalar nada.
      - name: Publish web build to GitHub Pages (docs/)
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll

      - name: Commit docs (web version)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🌐 deploy: web build a docs/ (GitHub Pages)"
          file_pattern: docs/
